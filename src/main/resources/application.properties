# Application
spring.application.name=${APP_NAME:merchant}

# Multipart
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=tms-report-dispute-sse
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# SASL/SCRAM authentication (set via env vars in staging/prod, empty locally)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5470}/${DB_DATABASE:merchant_dashboard}?prepareThreshold=0
spring.datasource.username=${DB_USERNAME:tms}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=20

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# SQL Init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/admin-schema.sql

# Jackson
spring.jackson.property-naming-strategy=SNAKE_CASE

# Server
server.port=${APP_PORT:8080}

# Redis (Sentinel mode). Per-env vars decide whether we hit the legacy
# plaintext listener or the TLS+ACL listener. Both the SSL bundle
# reference (spring.data.redis.ssl.bundle) and the bundle definition
# (spring.ssl.bundle.pem.redis-tls.truststore.certificate) are set via
# env vars only when TLS is on:
#   SPRING_DATA_REDIS_SSL_BUNDLE=redis-tls
#   SPRING_SSL_BUNDLE_PEM_REDIS_TLS_TRUSTSTORE_CERTIFICATE=/etc/redis-tls/ca.crt
# See infra/docs/redis-hardening-runbook.md.
spring.data.redis.sentinel.master=${REDIS_MASTER_NAME:mymaster}
spring.data.redis.sentinel.nodes=${REDIS_HOST:localhost}:${REDIS_PORT:26379}
# The hardened sentinels enforce per-service ACL auth (same user/password as the
# data nodes). Spring's data-node credentials below are NOT applied to the
# sentinel connection, so the sentinel creds must be set explicitly or Lettuce
# hits "NOAUTH" on the sentinel. Reuse the same REDIS_USERNAME/REDIS_PASSWORD.
spring.data.redis.sentinel.username=${REDIS_USERNAME:}
spring.data.redis.sentinel.password=${REDIS_PASSWORD:}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:false}
spring.data.redis.timeout=2s

# App
app.timezone=Africa/Lagos
app.jwt.secret=${JWT_SECRET:RVBnYqNvKOGrSRFAmloJz4wh8Hw4OVFG6PUsd87bM8x9y2z3}
app.jwt.expiration-ms=86400000

# Environment marker. Set to "staging" ONLY on the staging cluster (via the
# staging kustomize overlay's deployment patch). Left empty everywhere else, so
# the staging self-serve DB reset endpoints hard-refuse off staging.
app.environment=${APP_ENVIRONMENT:}

# Staging DB reset Job settings (only used when app.environment=staging).
app.staging-reset.namespace=${STAGING_RESET_NAMESPACE:default}
app.staging-reset.kubectl-image=${STAGING_RESET_KUBECTL_IMAGE:alpine/k8s:1.31.4}
app.staging-reset.runner-service-account=${STAGING_RESET_RUNNER_SA:staging-reset-runner}
app.staging-reset.script-configmap=${STAGING_RESET_SCRIPT_CONFIGMAP:staging-reset-script}
# Source CNPG cluster app credential injected into the reset Job so the in-cluster
# replication reconcile can CREATE SUBSCRIPTION without Secret-read RBAC. The
# password comes from a secretKeyRef on the CNPG-managed Secret (kubelet-injected);
# host/port/user are passed as literals.
app.staging-reset.source-db-secret=${STAGING_RESET_SOURCE_DB_SECRET:postgres-cluster-app}
app.staging-reset.source-db-secret-key=${STAGING_RESET_SOURCE_DB_SECRET_KEY:password}
app.staging-reset.source-db-host=${STAGING_RESET_SOURCE_DB_HOST:postgres-cluster-rw.default.svc.cluster.local}
app.staging-reset.source-db-port=${STAGING_RESET_SOURCE_DB_PORT:5432}
app.staging-reset.source-db-user=${STAGING_RESET_SOURCE_DB_USER:app}

# Notification Service
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service}
target.service.base-url=${TARGET_SERVICE_URL:http://target-service}

# Internal API key for service-to-service auth (shared across microservices)
grpc.api.key=${GRPC_API_KEY:secret}

# gRPC
grpc.timeout=${GRPC_TIMEOUT:30}
grpc.batch-timeout=${GRPC_BATCH_TIMEOUT:120}
grpc.logging=${GRPC_LOGGING:true}

# gRPC service endpoints
# In K8s: use service DNS names with port 80
# Locally: use localhost with each service's dev port
grpc.services.user.host=${USER_SERVICE_GRPC_HOST:localhost}
grpc.services.user.port=${USER_SERVICE_GRPC_PORT:8081}
grpc.services.wallet.host=${WALLET_SERVICE_GRPC_HOST:localhost}
grpc.services.wallet.port=${WALLET_SERVICE_GRPC_PORT:8083}
grpc.services.config.host=${CONFIG_SERVICE_GRPC_HOST:localhost}
grpc.services.config.port=${CONFIG_SERVICE_GRPC_PORT:8086}
grpc.services.transaction.host=${TRANSACTION_SERVICE_GRPC_HOST:localhost}
grpc.services.transaction.port=${TRANSACTION_SERVICE_GRPC_PORT:8084}
grpc.services.notification.host=${NOTIFICATION_SERVICE_GRPC_HOST:localhost}
grpc.services.notification.port=${NOTIFICATION_SERVICE_GRPC_PORT:8087}
grpc.services.ledger.host=${LEDGER_SERVICE_GRPC_HOST:localhost}
grpc.services.ledger.port=${LEDGER_SERVICE_GRPC_PORT:8088}
grpc.services.settlement.host=${SETTLEMENT_SERVICE_GRPC_HOST:localhost}
grpc.services.settlement.port=${SETTLEMENT_SERVICE_GRPC_PORT:8089}
grpc.services.kyc.host=${KYC_SERVICE_GRPC_HOST:localhost}
grpc.services.kyc.port=${KYC_SERVICE_GRPC_PORT:8085}
grpc.services.dispute.host=${DISPUTE_SERVICE_GRPC_HOST:localhost}
grpc.services.dispute.port=${DISPUTE_SERVICE_GRPC_PORT:8102}
grpc.services.b2b.host=${B2B_SERVICE_GRPC_HOST:b2b-service}
grpc.services.b2b.port=${B2B_SERVICE_GRPC_PORT:80}

# Mail sender
mail.from-address=${MAIL_FROM_ADDRESS:no-reply@irpay.dev}
mail.from-name=${MAIL_FROM_NAME:IRPay}

# Actuator + Prometheus metrics — scraped by Prometheus `microservices` job
# at /actuator/prometheus on port 8080.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=merchant-backend

# Logging
# The SecurityConfig intentionally wires its own DaoAuthenticationProvider, so
# Spring Security's global UserDetailsService auto-configuration is deliberately
# bypassed. Silence the (expected) InitializeUserDetailsManagerConfigurer WARN.
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
