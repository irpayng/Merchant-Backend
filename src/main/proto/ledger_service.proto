syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.tms.report.grpc.ledger";

package ledger;

service LedgerService {
  rpc DetectGlDiscrepancies (DetectDiscrepanciesRequest) returns (DiscrepanciesResponse);
  rpc FixGlDiscrepancy (FixDiscrepancyRequest) returns (LedgerCommandResponse);
  rpc RecordSettlementLanding (RecordSettlementLandingRequest) returns (LedgerCommandResponse);
  rpc RecordSettlementLandings (RecordSettlementLandingsRequest) returns (LedgerCommandResponse);
  rpc ClosePeriod (ClosePeriodRequest) returns (PeriodCloseResponse);
  rpc ListPeriodCloses (ListPeriodClosesRequest) returns (PeriodClosesResponse);
}

message DetectDiscrepanciesRequest {
  string source_type = 1;
}

message Discrepancy {
  int64 entry_id = 1;
  string source_type = 2;
  int64 source_id = 3;
  string issue = 4;
}

message DiscrepanciesResponse {
  repeated Discrepancy discrepancies = 1;
}

message FixDiscrepancyRequest {
  repeated int64 entry_ids = 1;
}

message LedgerCommandResponse {
  bool success = 1;
  string message = 2;
}

message RecordSettlementLandingRequest {
  string receivable_sub_category = 1;
  string amount = 2;
  string landing_reference = 3;
  string description = 4;
  int64 actor_user_id = 5;
  string actor_email = 6;
}

message LandingEntryItem {
  string transaction_reference = 1;
  string amount = 2;
}

message RecordSettlementLandingsRequest {
  string receivable_sub_category = 1;
  repeated LandingEntryItem entries = 2;
  int64 actor_user_id = 3;
  string actor_email = 4;
}

message ClosePeriodRequest {
  int32 year = 1;
  int32 month = 2;
  int64 actor_user_id = 3;
  string actor_email = 4;
}

message PeriodCloseRecord {
  int32 year = 1;
  int32 month = 2;
  string period_label = 3;
  string closed_at = 4;
  string closed_by_email = 5;
  int32 closing_entry_count = 6;
  string total_revenue_closed = 7;
  string total_expense_closed = 8;
  string net_to_retained_earnings = 9;
}

message PeriodCloseResponse {
  bool success = 1;
  string message = 2;
  PeriodCloseRecord record = 3;
}

message ListPeriodClosesRequest {
  int32 limit = 1;
}

message PeriodClosesResponse {
  repeated PeriodCloseRecord records = 1;
}
