syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.tms.report.grpc.config";

package config;

service ConfigService {
  rpc ValidateTransaction (ValidateTransactionRequest) returns (ValidateTransactionResponse);
  rpc CreateConfiguration (CreateConfigurationRequest) returns (ConfigCommandResponse);
  rpc UpdateConfiguration (UpdateConfigurationRequest) returns (ConfigCommandResponse);
  rpc DeleteConfiguration (DeleteConfigurationRequest) returns (ConfigCommandResponse);
  rpc CreateDataPlan (DataPlanRequest) returns (ConfigCommandResponse);
  rpc UpdateDataPlan (DataPlanRequest) returns (ConfigCommandResponse);
  rpc DeleteDataPlan (DeleteDataPlanRequest) returns (ConfigCommandResponse);
  rpc ImportDataPlans (ImportDataPlansRequest) returns (ConfigCommandResponse);
  rpc GetConfigValue (GetConfigValueRequest) returns (GetConfigValueResponse);
  rpc SetMaxBalance (SetMaxBalanceRequest) returns (ConfigCommandResponse);
  rpc RemoveMaxBalance (RemoveMaxBalanceRequest) returns (ConfigCommandResponse);
  // Terminal management RPCs
  rpc CreateTerminal (CreateTerminalRequest) returns (ConfigCommandResponse);
  rpc CreateTerminalsBatch (CreateTerminalsBatchRequest) returns (ConfigCommandResponse);
  rpc UpdateTerminal (UpdateTerminalRequest) returns (ConfigCommandResponse);
  rpc MapTerminal (MapTerminalRequest) returns (ConfigCommandResponse);
  rpc UnmapTerminal (UnmapTerminalRequest) returns (ConfigCommandResponse);
  // TID management RPCs
  rpc CreateTid (CreateTidRequest) returns (ConfigCommandResponse);
  rpc UpdateTid (UpdateTidRequest) returns (ConfigCommandResponse);
  rpc DeleteTid (DeleteTidRequest) returns (ConfigCommandResponse);
  // Funding alert RPCs
  rpc CreateFundingAlert (CreateFundingAlertRequest) returns (ConfigCommandResponse);
  rpc UpdateFundingAlert (UpdateFundingAlertRequest) returns (ConfigCommandResponse);
  rpc DeleteFundingAlert (DeleteFundingAlertRequest) returns (ConfigCommandResponse);
  // Provider balance cache RPCs
  rpc GetProviderBalance (GetProviderBalanceRequest) returns (ProviderBalanceResponse);
  rpc GetAllProviderBalances (GetAllProviderBalancesRequest) returns (AllProviderBalancesResponse);
  // Trigger an immediate on-demand balance poll for a provider (admin action).
  rpc RefreshProviderBalance (RefreshProviderBalanceRequest) returns (ConfigCommandResponse);
  // Trigger an immediate on-demand card-key (TMK/TSK/TPK) re-download for a card
  // processor (admin action). Broadcasts a provider-keys-refresh command.
  rpc RefreshProviderCardKeys (RefreshProviderCardKeysRequest) returns (ConfigCommandResponse);
  // Instant settlement RPCs
  rpc EnrollInstantSettlement (EnrollInstantSettlementRequest) returns (ConfigCommandResponse);
  rpc SuspendInstantSettlement (SuspendInstantSettlementRequest) returns (ConfigCommandResponse);
  rpc RevokeInstantSettlement (RevokeInstantSettlementRequest) returns (ConfigCommandResponse);
  rpc ReactivateInstantSettlement (ReactivateInstantSettlementRequest) returns (ConfigCommandResponse);
  rpc UpdateSettlementWindow (UpdateSettlementWindowRequest) returns (ConfigCommandResponse);
  rpc CheckInstantSettlement (CheckInstantSettlementRequest) returns (CheckInstantSettlementResponse);
}

message ValidateTransactionRequest {
  string user_email = 1;
  string product_code = 2;
  string channel = 3;
  string user_type = 4;
  string tier_code = 5;
  double amount = 6;
  double daily_total = 7;
  string payment_method = 8;
}

message ValidateTransactionResponse {
  bool allowed = 1;
  string reject_reason = 2;
  double service_fee = 3;
  double amount_to_pay = 4;
  double agent_commission = 5;
  double aggregator_commission = 6;
  double user_commission = 7;
  double company_commission = 8;
  int64 product_id = 9;
  string product_name = 10;
  repeated CustomCharge custom_charges = 11;
  // Fields 12 reserved for provider_code in other service protos
  // JSON snapshot of the config rules evaluated at validation time (for audit).
  string config_snapshot = 13;
  // Reserved 14 for parity with config-service's custom_charges_json.
  // Slice that goes to the agent's super aggregator (the aggregator's parent).
  double super_aggregator_commission = 15;
}

message CustomCharge {
  string name = 1;
  double amount = 2;
  int64 config_id = 3;
}

message CreateConfigurationRequest {
  string module = 1;
  string type = 2;
  string expression = 3;
  string value = 4;
  string description = 5;
  string name = 6;
}

message UpdateConfigurationRequest {
  int64 id = 1;
  string module = 2;
  string type = 3;
  string expression = 4;
  string value = 5;
  string description = 6;
  string name = 7;
}

message DeleteConfigurationRequest {
  int64 id = 1;
}

message DataPlanRequest {
  int64 id = 1;
  string reference = 2;
  string sub_code = 3;
  string provider_sub_code = 4;
  string provider = 5;
  string network = 6;
  double amount = 7;
  double cost = 8;
  string bundle = 9;
  string duration = 10;
  string description = 11;
  string category = 12;
}

message DeleteDataPlanRequest {
  int64 id = 1;
}

message ImportDataPlansRequest {
  repeated DataPlanRequest plans = 1;
}

message ConfigCommandResponse {
  bool success = 1;
  string message = 2;
  string reference = 3;
  string data_json = 4;
}

message GetConfigValueRequest {
  string module = 1;
  string type = 2;
  map<string, string> context = 3;
}

message GetConfigValueResponse {
  bool found = 1;
  string value = 2;
}

message SetMaxBalanceRequest {
  string user_type = 1;
  string tier = 2;
  string value = 3;
  string description = 4;
}

message RemoveMaxBalanceRequest {
  string user_type = 1;
  string tier = 2;
}

// ── Terminal management messages ──

message CreateTerminalRequest {
  string serial = 1;
  string make = 2;
  string model = 3;
  string os = 4;
}

message TerminalEntry {
  string serial = 1;
  string make = 2;
  string model = 3;
  string os = 4;
}

message CreateTerminalsBatchRequest {
  repeated TerminalEntry terminals = 1;
}

message UpdateTerminalRequest {
  int64 terminal_id = 1;
  string make = 2;
  string model = 3;
  string os = 4;
  bool is_active = 5;
}

message MapTerminalRequest {
  int64 terminal_id = 1;
  int64 user_id = 2;
}

message UnmapTerminalRequest {
  int64 terminal_id = 1;
}

// ── TID management messages ──

message CreateTidRequest {
  string terminal_id = 1;
  string merchant_id = 2;
  string merchant_name = 3;
  string bank_acc_no = 4;
  bool internal = 6;
  string merchant_category_code = 8;
  string state_code = 9;
  string email = 11;
  string merchant_physical_addr = 12;
  string merchant_address_lga_code = 13;
  string processor = 14;
}

message UpdateTidRequest {
  int64 tid_id = 1;
  string terminal_id = 2;
  string merchant_id = 3;
  bool internal = 5;
  string merchant_name = 7;
  string bank_acc_no = 8;
  string merchant_category_code = 9;
  string state_code = 10;
  string email = 11;
  string merchant_physical_addr = 12;
  string merchant_address_lga_code = 13;
  string processor = 14;
  bool update_processor = 15;
}

message DeleteTidRequest {
  int64 tid_id = 1;
}

// ── Funding alert messages ──

message CreateFundingAlertRequest {
  int64 provider_id = 1;
  double amount = 2;
  repeated string emails = 3;
  repeated string phone_numbers = 4;
  repeated string admin_ids = 5;
  string notify_via = 6;
  string interval = 7;
}

message UpdateFundingAlertRequest {
  int64 funding_alert_id = 1;
  int64 provider_id = 2;
  double amount = 3;
  repeated string emails = 4;
  repeated string phone_numbers = 5;
  repeated string admin_ids = 6;
  string notify_via = 7;
  string interval = 8;
}

message DeleteFundingAlertRequest {
  int64 funding_alert_id = 1;
}

// ── Provider balance cache messages ──

message GetProviderBalanceRequest {
  string provider_code = 1;
}

message RefreshProviderBalanceRequest {
  string provider_code = 1;
  string triggered_by = 2;
}

message RefreshProviderCardKeysRequest {
  string provider_code = 1;
  string triggered_by = 2;
}

message ProviderBalanceResponse {
  string provider_code = 1;
  double balance = 2;
  string source_account_number = 3;
  bool is_healthy = 4;
  string last_error = 5;
  string last_checked_at = 6;
}

message GetAllProviderBalancesRequest {}

message AllProviderBalancesResponse {
  repeated ProviderBalanceResponse balances = 1;
}

// ── Instant settlement messages ──

message EnrollInstantSettlementRequest {
  int64 user_id = 1;
  string approved_by = 3;
  string notes = 4;
  // Optional. See config_service.proto in tms-config for full semantics.
  string email = 5;
  bool window_enabled = 6;
  string settlement_times = 7;
  string destination_account_number = 8;
  string destination_bank_code = 9;
  string destination_account_name = 10;
}

message UpdateSettlementWindowRequest {
  int64 user_id = 1;
  bool window_enabled = 2;
  string settlement_times = 3;
  string destination_account_number = 4;
  string destination_bank_code = 5;
  string destination_account_name = 6;
}

message CheckInstantSettlementRequest {
  int64 user_id = 1;
}

message CheckInstantSettlementResponse {
  bool active = 1;
  string status = 2;
  bool window_enabled = 3;
  string settlement_times = 4;
  string destination_account_number = 5;
  string destination_bank_code = 6;
  string destination_account_name = 7;
}

message SuspendInstantSettlementRequest {
  int64 user_id = 1;
  string reason = 2;
}

message RevokeInstantSettlementRequest {
  int64 user_id = 1;
  string reason = 2;
}

message ReactivateInstantSettlementRequest {
  int64 user_id = 1;
  string notes = 2;
}
