syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.tms.report.grpc.notification";

package notification;

service NotificationService {
  rpc SendSms (SendSmsRequest) returns (NotificationResponse);
  rpc SendEmail (SendEmailRequest) returns (NotificationResponse);
  rpc SendNotification (SendNotificationCommandRequest) returns (NotificationCommandResponse);
  rpc CreateLowBalanceAlert (LowBalanceAlertRequest) returns (NotificationCommandResponse);
  rpc UpdateLowBalanceAlert (LowBalanceAlertRequest) returns (NotificationCommandResponse);
  rpc DeleteLowBalanceAlert (DeleteLowBalanceAlertRequest) returns (NotificationCommandResponse);
}

message SendSmsRequest {
  string phone_number = 1;
  string message = 2;
}

message SendEmailRequest {
  string to = 1;
  string subject = 2;
  string html_body = 3;
  string template_name = 4;
  map<string, string> template_data = 5;
}

message NotificationResponse {
  bool success = 1;
  string message = 2;
}

// Admin command messages
message Actor {
  string id = 1;
  string name = 2;
  string email = 3;
}

message SendNotificationCommandRequest {
  string reference = 1;
  string notifiable_id = 2;
  string subject = 3;
  string message = 4;
  repeated string channels = 5;
  map<string, string> data = 6;
  Actor actor = 7;
}

message NotificationCommandResponse {
  bool success = 1;
  string message = 2;
  string reference = 3;
  string data_json = 4;
}

// Low balance alert messages
message LowBalanceAlertRequest {
  int64 provider_id = 1;
  string provider_code = 2;
  double amount = 3;
  repeated string emails = 4;
  repeated string phone_numbers = 5;
  string admin_ids = 6;
  string notify_via = 7;
  string interval = 8;
  int64 alert_id = 9;
}

message DeleteLowBalanceAlertRequest {
  int64 alert_id = 1;
  int64 provider_id = 2;
}
